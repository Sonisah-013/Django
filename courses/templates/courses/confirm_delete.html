{% extends 'base.html' %}
{% block content %}
<div class="card card-pad">
  <h2>Delete "{{ course.name }}"?</h2>
  <p>This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'courses:course_details' course.id %}" class="btn btn-ghost">Cancel</a>
  </form>
</div>
{% endblock %}
