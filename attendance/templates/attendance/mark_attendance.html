{% extends 'base.html' %}
{% block content %}
<div class="page-container">
    <h2>Mark Attendance - {{ course.name }}</h2>

    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <label>Date: <input type="date" name="date" required></label>
        </div>

        <table class="attendance-table">
            <tr>
                <th>Student</th>
                <th>Status</th>
            </tr>
            {% for student in students %}
            <tr>
                <td>
                    <a href="{% url 'attendance:student_report' student.id %}">
                        {{ student.first_name }} {{ student.last_name }}
                    </a>
                </td>
                <td>
                    <select name="status_{{ student.id }}">
                        <option value="present">Present</option>
                        <option value="absent">Absent</option>
                        <option value="late">Late</option>
                    </select>
                </td>
            </tr>
            {% endfor %}
        </table>

        <button type="submit" class="save-btn">Save Attendance</button>
    </form>
</div>

<style>
    .page-container {
        max-width: 900px;
        margin: 40px auto;
        padding: 30px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .page-container h2 {
        margin-bottom: 20px;
    }
    .form-row {
        margin-bottom: 20px;
    }
    .attendance-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
    }
    .attendance-table th, .attendance-table td {
        border: 1px solid #ccc;
        padding: 12px;
        text-align: left;
    }
    .attendance-table th {
        background: #1c2b3a;
        color: #fff;
    }
    .save-btn {
        background: #1c2b3a;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
    }
    .save-btn:hover {
        background: #2e4258;
    }
</style>
{% endblock %}
