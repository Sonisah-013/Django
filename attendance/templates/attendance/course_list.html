{% extends 'base.html' %}
{% block content %}
<h2>Select a Class</h2>
<ul>
    {% for course in courses %}
    <li>
        {{ course.name }} —
        <a href="{% url 'attendance:mark' course.id %}">Mark Attendance</a> |
        <a href="{% url 'attendance:report' course.id %}">View Report</a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
