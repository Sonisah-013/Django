{% extends 'base.html' %}
{% block content %}
<div class="page-container">
    <h2>Add Marks - {{ exam.name }} ({{ exam.course.name }})</h2>
    <p>Total Marks: {{ exam.total_marks }}</p>

    <form method="post">
        {% csrf_token %}
        <table class="attendance-table">
            <tr>
                <th>Student</th>
                <th>Marks Obtained</th>
            </tr>
            {% for student in students %}
            <tr>
                <td>{{ student.first_name }} {{ student.last_name }}</td>
                <td>
                    <input type="number" name="marks_{{ student.id }}" min="0" max="{{ exam.total_marks }}">
                </td>
            </tr>
            {% endfor %}
        </table>
        <button type="submit" class="save-btn">Save Marks</button>
    </form>
</div>
{% endblock %}
